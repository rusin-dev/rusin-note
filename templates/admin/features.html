{% extends "base.html" %}
{% block content %}
<h1>{{ t('admin_features_title') }}</h1>
<p class="empty" style="margin-top: 8px;">{{ t('admin_features_desc') }}</p>
{% if saved %}<p style="color: #1a7f37; margin-top: 12px;">{{ t('admin_features_saved') }}</p>{% endif %}
<form method="post" action="/admin/features" style="margin-top: 20px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for f in features %}
    <div class="ff-row">
        <i class="fa-solid {{ f.icon }}" aria-hidden="true"></i>
        <span class="ff-name">{{ t('feature_' ~ f.key) }}</span>
        <label class="ff-switch" title="{{ t('feature_on') if f.enabled else t('feature_off') }}">
            <input type="checkbox" name="flag_{{ f.key }}" value="1"{% if f.enabled %} checked{% endif %}>
            <span class="ff-track"></span>
        </label>
    </div>
    {% endfor %}
    <button type="submit" style="margin-top: 8px; max-width: 240px;">{{ t('admin_features_submit') }}</button>
</form>
<p style="margin-top: 24px;"><a href="/count">{{ t('nav_stats') }}</a> · <a href="/">{{ t('back_home') }}</a></p>
{% endblock %}
