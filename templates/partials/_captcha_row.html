{% if captcha_enabled %}
<input type="hidden" name="captcha_token" id="captchaToken" value="{{ captcha_token }}">
{% if captcha_type == 'slide' %}
<input type="hidden" name="captcha_x" id="captchaX" value="">
<input type="hidden" name="captcha_traj" id="captchaTraj" value="">
<div class="form-group">
    <label>{{ t('login_captcha_slide') }}</label>
    <div class="slide-captcha" id="slideCaptcha"
         data-w="{{ captcha_slide.W }}" data-s="{{ captcha_slide.S }}"
         data-tm="{{ captcha_slide.tm }}" data-pw="{{ captcha_slide.pw }}"
         data-y="{{ captcha_slide.y_top }}"
         data-curve='{{ captcha_slide.curve|tojson }}'>
        <div class="slide-stage" id="slideStage">
            <div class="slide-bg" id="slideBg">{{ captcha_slide.bg|safe }}</div>
            <div class="slide-piece" id="slidePiece" style="top:{{ captcha_slide.y_top }}px;width:{{ captcha_slide.pw }}px">{{ captcha_slide.piece|safe }}</div>
            <button type="button" class="captcha-refresh slide-refresh" onclick="refreshCaptcha()"
                    title="{{ t('login_captcha_refresh') }}" aria-label="{{ t('login_captcha_refresh') }}">
                <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            </button>
        </div>
        <div class="slide-track" id="slideTrack">
            <div class="slide-track-fill" id="slideFill"></div>
            <span class="slide-hint" id="slideHint">{{ t('login_captcha_slide_hint') }}</span>
            <div class="slide-thumb" id="slideThumb" role="slider" tabindex="0"
                 aria-label="{{ t('login_captcha_slide') }}" aria-valuemin="0" aria-valuemax="{{ captcha_slide.S }}" aria-valuenow="0">
                <i class="fa-solid fa-angles-right" aria-hidden="true"></i>
            </div>
        </div>
    </div>
</div>
{% else %}
<div class="form-group">
    <label for="captchaInput">{{ t('login_captcha') }}</label>
    <div class="captcha-row">
        <input type="text" id="captchaInput" name="captcha" maxlength="8"
               placeholder="{{ t('login_captcha_placeholder') }}"
               autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <span class="captcha-img" id="captchaBox" title="{{ t('login_captcha_refresh') }}">{{ captcha_svg|safe }}</span>
        <button type="button" class="captcha-refresh" onclick="refreshCaptcha()"
                title="{{ t('login_captcha_refresh') }}" aria-label="{{ t('login_captcha_refresh') }}">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
        </button>
    </div>
</div>
{% endif %}
{% endif %}
