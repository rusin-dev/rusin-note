{% extends "base.html" %}
{% block content %}
<h1>{{ t('register_title') }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label>{{ t('reg_username_label') }}</label>
        <input type="text" name="username" required pattern="[a-zA-Z0-9_\-]+">
    </div>
    <div class="form-group">
        <label>{{ t('reg_password_label', req=req_desc) }}</label>
        <input type="password" name="password" required>
    </div>
    <div class="form-group">
        <label>{{ t('reg_confirm_label') }}</label>
        <input type="password" name="confirm" required>
    </div>
    <button type="submit">{{ t('reg_submit') }}</button>
</form>
<p style="margin-top:12px;"><a href="/login">{{ t('reg_have_account') }}</a></p>
{% endblock %}
