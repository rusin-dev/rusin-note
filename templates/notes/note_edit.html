<!DOCTYPE html>
<html{% if theme %} data-theme="{{ theme }}"{% endif %} lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ full_title|e }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preload" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"></noscript>
    {{ theme_script|safe }}
    <script defer src="{{ config.GLOBAL_CDN }}/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="{{ config.GLOBAL_CDN }}/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    {{ latex_head|safe }}
    {{ code_highlight_head|safe }}
    <style>
        {{ theme_vars|safe }}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
        .navbar { background: var(--navbar-bg); padding: 10px 24px; border-bottom: 1px solid var(--navbar-border); display: flex; align-items: center; flex-wrap: nowrap; gap: 16px; font-size: 14px; overflow: hidden; position: fixed; top: 0; left: 0; right: 0; z-index: 30; }
        .navbar-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-size: 16px; font-weight: 600; flex-shrink: 0; min-width: 0; overflow: hidden; }
        .navbar-brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .navbar-brand:hover { color: var(--link); }
        .navbar-brand-icon { width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0; }
        .navbar .user-info { font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .navbar .nav-links { display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0; white-space: nowrap; }
        .navbar .nav-links a { margin-left: 16px; color: var(--link); text-decoration: none; }
        .navbar .nav-links a:hover { text-decoration: underline; }
        .navbar .nav-links i { margin-right: 5px; }
        .theme-toggle, .nav-menu-btn {
            width: 36px; height: 36px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; font-size: 15px;
            border-radius: 8px;
            background: var(--bg);
            border: 1px solid var(--navbar-border);
            color: var(--text);
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .theme-toggle:hover, .nav-menu-btn:hover { background: var(--card-bg); }
        .nav-menu-btn { display: none; }
        .navbar.menu-collapsed { flex-wrap: wrap; }
        .navbar.menu-collapsed .nav-menu-btn { display: inline-flex; }
        .navbar.menu-collapsed .nav-links {
            order: 10;
            flex-basis: 100%;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            white-space: normal;
            display: none;
        }
        .navbar.menu-collapsed .nav-links a { margin-left: 0; padding: 10px 0; border-bottom: 1px solid var(--navbar-border); }
        .navbar.menu-collapsed .nav-links a:last-child { border-bottom: none; }
        .navbar.menu-collapsed.menu-open .nav-links {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--navbar-border);
            border-radius: 8px;
            padding: 6px 16px;
            margin-top: 2px;
        }

        .editor-shell { position: fixed; top: 0; left: 0; right: 0; bottom: 0; padding-top: 50px; display: flex; }
        .pane { display: flex; flex-direction: column; min-width: 0; flex: 1 1 0; }
        .pane.editor-pane { border-right: 1px solid var(--navbar-border); }
        .pane.preview-pane { background: var(--bg); }
        .pane-header { height: 34px; padding: 0 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--navbar-border); background: var(--navbar-bg); text-transform: uppercase; letter-spacing: 0.5px; flex: 0 0 auto; display: flex; align-items: center; }
        textarea { flex: 1; width: 100%; border: none; padding: 20px 24px; font-size: 16px; line-height: 1.7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; resize: none; outline: none; background: var(--bg); color: var(--text); }
        .preview-body { flex: 1; overflow-y: auto; padding: 20px 24px; font-size: 16px; line-height: 1.7; word-break: break-word; }
        .preview-empty { color: var(--muted); font-style: italic; }

        .save-btn { position: fixed; bottom: 24px; right: 24px; background: var(--btn-bg); border: 1px solid var(--navbar-border); padding: 8px 20px; border-radius: 20px; font-size: 14px; color: var(--text); cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; z-index: 10; font-weight: 500; }
        .save-btn:hover { background: var(--btn-hover); transform: scale(1.02); }
        .save-btn:active { background: var(--border); transform: scale(0.98); }
        .pane-header.editor-header { justify-content: space-between; }
        .pane-header.preview-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .preview-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
        .md-manual { color: var(--link); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .md-manual:hover { color: var(--link); text-decoration: underline; }
        .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 400; color: var(--text); user-select: none; }
        .switch input { display: none; }
        .switch .track { position: relative; width: 36px; height: 20px; background: var(--border); border-radius: 999px; flex-shrink: 0; transition: background 0.2s ease; }
        .switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform 0.2s ease; }
        .switch input:checked + .track { background: var(--link); }
        .switch input:checked + .track::after { transform: translateX(16px); }
        .preview-off { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; cursor: pointer; text-align: center; font-style: italic; padding: 0 16px; }
        .save-hint { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.75); color: #fff; padding: 10px 24px; border-radius: 24px; font-size: 14px; letter-spacing: 0.5px; backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; z-index: 20; font-weight: 400; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .save-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .save-hint kbd { background: rgba(255, 255, 255, 0.2); padding: 2px 12px; border-radius: 6px; margin: 0 4px; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.15); font-family: inherit; }
        .save-status { position: fixed; bottom: 80px; right: 24px; font-size: 14px; color: #4CAF50; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; z-index: 15; background: var(--status-bg); padding: 6px 18px; border-radius: 16px; border: 1px solid #4CAF50; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transform: translateY(10px); }
        .save-status.show { opacity: 1; transform: translateY(0); }
        .save-status.saving { color: #ff9800; border-color: #ff9800; }
        .save-status.error { color: #f44336; border-color: #f44336; }
        .note-mtime { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); z-index: 10; user-select: none; }

        /* Markdown preview typography (matches server-side bleach output) */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { border-bottom: 1px solid var(--heading-border); padding-bottom: 6px; margin: 16px 0 12px; }
        .markdown-body h1 { font-size: 1.8em; }
        .markdown-body h2 { font-size: 1.4em; }
        .markdown-body h3 { font-size: 1.2em; }
        .markdown-body p { margin: 8px 0; }
        .markdown-body ul, .markdown-body ol { padding-left: 2em; margin: 8px 0; }
        .markdown-body code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-family: Consolas, Monaco, "Courier New", monospace; font-size: 0.9em; }
        .markdown-body pre { background: var(--code-bg); padding: 12px; border-radius: 4px; overflow-x: auto; margin: 12px 0; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body blockquote { border-left: 4px solid var(--quote-border); padding-left: 16px; color: var(--quote-text); margin: 8px 0; }
        .markdown-body a { color: var(--link); }
        .markdown-body hr { border: none; border-top: 1px solid var(--heading-border); margin: 16px 0; }
        .markdown-body table { border-collapse: collapse; margin: 12px 0; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 6px 10px; }
        .markdown-body img { max-width: 100%; }

        /* Mobile: hide preview by default; toggle button reveals it */
        @media (max-width: 768px) {
            .pane.preview-pane { display: none; }
            .pane.editor-pane { border-right: none; }
            .editor-shell.show-preview .pane.preview-pane { display: flex; position: absolute; top: 50px; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 5; }
            .editor-shell.show-preview .pane.editor-pane { display: none; }
        }
        @media (min-width: 769px) {
            .editor-shell.preview-hidden .pane.preview-pane { display: none; }
            .editor-shell.preview-hidden .pane.editor-pane { border-right: none; }
        }
        @media (max-width: 640px) {
            .navbar { gap: 12px; padding: 10px 16px; }
            .navbar-brand-name { max-width: 45vw; }
            textarea { padding: 16px 18px; font-size: 15px; }
            .save-btn { bottom: 16px; right: 16px; padding: 6px 16px; font-size: 13px; }
            .save-hint { bottom: 70px; padding: 8px 16px; font-size: 12px; white-space: nowrap; }
            .save-status { bottom: 70px; right: 16px; font-size: 12px; padding: 4px 14px; }
            .note-mtime { bottom: 16px; font-size: 11px; }
        }
    </style>
</head>
<body>
    {% include "partials/_navbar.html" %}
    <div class="editor-shell" id="editorShell">
        <div class="pane editor-pane">
            <div class="pane-header editor-header" id="editorHeader">
                <span>{{ t('note_editor_label') }}</span>
                <label class="switch" id="previewSwitchWrap">
                    <input type="checkbox" id="previewSwitch">
                    <span class="track"></span>
                    <span class="switch-label">{{ t('note_live_preview') }}</span>
                </label>
            </div>
            <form method="POST" action="{{ action_url }}" id="noteForm" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <textarea name="content" id="noteContent" autofocus spellcheck="true">{{ content|e }}</textarea>
            </form>
        </div>
        <div class="pane preview-pane">
            <div class="pane-header preview-header" id="previewHeader">
                <span class="preview-title">
                    <span>{{ t('note_preview_label') }}</span>
                    {% if md_manual_url %}<a class="md-manual" href="{{ md_manual_url|e }}" target="_blank" rel="noopener noreferrer">{{ t('md_manual') }}</a>{% endif %}
                </span>
            </div>
            <div class="preview-body markdown-body" id="previewBody"></div>
        </div>
    </div>
    <button type="button" class="save-btn" id="saveBtn">{{ t('note_save_btn') }}</button>
    <div class="save-hint" id="saveHint">{{ hint_text|safe }}</div>
    <div class="save-status" id="saveStatus"></div>
    <div class="note-mtime" id="noteMtime">{{ last_edited }}</div>
    <script>
        (function () {
            var GAP = 16;
            function updateMenuState() {
                var navbar = document.querySelector('.navbar');
                var links = document.querySelector('.nav-links');
                var menuBtn = document.querySelector('.nav-menu-btn');
                var brand = document.querySelector('.navbar-brand');
                var user = document.querySelector('.user-info');
                var theme = document.querySelector('.theme-toggle');
                if (!navbar || !links || !menuBtn || !brand) return;
                var wasOpen = navbar.classList.contains('menu-open');
                navbar.classList.remove('menu-collapsed', 'menu-open');
                [links, user, theme].forEach(function (el) {
                    if (!el) return;
                    el.style.position = 'absolute';
                    el.style.visibility = 'hidden';
                    el.style.whiteSpace = 'nowrap';
                });
                if (user) user.style.flex = 'none';
                var linksW = links.scrollWidth;
                var userW = user ? user.scrollWidth : 0;
                var themeW = theme ? theme.offsetWidth : 0;
                var menuW = menuBtn.offsetWidth;
                var total = brand.offsetWidth + userW + linksW + themeW + menuW + GAP * 3;
                [links, user, theme].forEach(function (el) {
                    if (!el) return;
                    el.style.position = '';
                    el.style.visibility = '';
                    el.style.whiteSpace = '';
                });
                if (user) user.style.flex = '';
                if (total > navbar.clientWidth) {
                    navbar.classList.add('menu-collapsed');
                    if (wasOpen) navbar.classList.add('menu-open');
                }
            }
            window.toggleMenu = function () {
                var navbar = document.querySelector('.navbar');
                var menuBtn = document.querySelector('.nav-menu-btn');
                if (!navbar || !menuBtn) return;
                var open = navbar.classList.toggle('menu-open');
                menuBtn.innerHTML = open
                    ? '<i class="fa-solid fa-xmark" aria-hidden="true"></i>'
                    : '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
            };
            window.addEventListener('load', updateMenuState);
            window.addEventListener('resize', updateMenuState);
            updateMenuState();
        })();
    </script>
    <script>
        (function() {
            const form = document.getElementById('noteForm');
            const textarea = document.getElementById('noteContent');
            const saveBtn = document.getElementById('saveBtn');
            const saveHint = document.getElementById('saveHint');
            const saveStatus = document.getElementById('saveStatus');
            const previewBody = document.getElementById('previewBody');
            const editorShell = document.getElementById('editorShell');
            const editorHeader = document.getElementById('editorHeader');
            const previewHeader = document.getElementById('previewHeader');
            const previewSwitch = document.getElementById('previewSwitch');
            const previewSwitchWrap = document.getElementById('previewSwitchWrap');
            let saveTimeout = null;
            let statusTimeout = null;
            let hintTimeout = null;
            let isSaving = false;
            const DEFAULT_HINT = {{ hint_text|tojson }};
            const L10N = {{ l10n|tojson }};
            const CSRF_FIELD = "csrf_token";

            // 实时渲染开关：默认取配置，访客可手动切换并以 localStorage 记住
            const PREVIEW_KEY = 'rusin-live-preview';
            let previewOn;
            try {
                const saved = localStorage.getItem(PREVIEW_KEY);
                previewOn = saved === null ? {{ live_preview_default|tojson }} : saved === '1';
            } catch (e) { previewOn = {{ live_preview_default|tojson }}; }

            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 4;
                    updatePreview();
                }
            });

            function showHint(message) {
                if (message) saveHint.innerHTML = message;
                saveHint.classList.add('show');
                clearTimeout(hintTimeout);
                hintTimeout = setTimeout(function() { saveHint.classList.remove('show'); }, 4000);
            }

            function showStatus(message, type) {
                saveStatus.textContent = message;
                saveStatus.className = 'save-status show';
                if (type) saveStatus.classList.add(type);
                clearTimeout(statusTimeout);
                statusTimeout = setTimeout(function() { saveStatus.classList.remove('show'); }, 2500);
            }

            setTimeout(function() { showHint(DEFAULT_HINT); }, 600);

            let inputTimer = null;
            textarea.addEventListener('input', function() {
                clearTimeout(inputTimer);
                inputTimer = setTimeout(function() { showHint(DEFAULT_HINT); }, 3000);
                updatePreview();
            });
            textarea.addEventListener('focus', function() { showHint(DEFAULT_HINT); });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveNote();
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
                    e.preventDefault();
                    togglePreview();
                }
                if (e.key === 'Escape') {
                    saveHint.classList.remove('show');
                    saveStatus.classList.remove('show');
                }
            });

            saveBtn.addEventListener('click', function(e) {
                e.preventDefault();
                saveNote();
            });

            function saveNote() {
                if (isSaving) return;
                isSaving = true;
                showStatus(L10N.saving, 'saving');
                const content = textarea.value;
                const csrfValue = form.querySelector('input[name="' + CSRF_FIELD + '"]').value;
                fetch(window.location.href, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'content=' + encodeURIComponent(content) + '&' + CSRF_FIELD + '=' + encodeURIComponent(csrfValue)
                })
                .then(response => {
                    isSaving = false;
                    if (response.ok) {
                        showStatus(L10N.saved, '');
                        showHint(L10N.savedHint);
                    } else {
                        showStatus(L10N.failedStatus.replace('{status}', response.status), 'error');
                        showHint(L10N.retryHint);
                    }
                })
                .catch(error => {
                    isSaving = false;
                    showStatus(L10N.netError, 'error');
                    showHint(L10N.failedMsg + error.message);
                });
            }

            function updatePreview() {
                if (!previewOn) return;
                if (!window.marked) return;
                const raw = textarea.value;
                if (!raw.trim()) {
                    previewBody.innerHTML = '';
                    return;
                }
                let html = '';
                try { html = window.marked.parse(raw, { breaks: false, gfm: true }); }
                catch (e) { previewBody.innerHTML = '<p class="error">渲染失败</p>'; return; }
                if (window.DOMPurify) {
                    html = window.DOMPurify.sanitize(html, {
                        ALLOWED_TAGS: ['p','br','strong','em','u','strike','a','ul','ol','li','blockquote','pre','code','h1','h2','h3','h4','h5','h6','hr','table','thead','tbody','tr','th','td','div','span','img','input','dl','dt','dd','details','summary','abbr','sup','sub'],
                        ALLOWED_ATTR: ['href','title','target','class','src','alt','rel','type','checked','disabled','id']
                    });
                }
                previewBody.innerHTML = html;
                if (window.CodeHighlight) window.CodeHighlight.apply(previewBody);
                if (window.renderMathInElement) {
                    window.renderMathInElement(previewBody, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            }

            function applyPreviewState() {
                previewSwitch.checked = previewOn;
                editorShell.classList.toggle('preview-hidden', !previewOn);
                (previewOn ? previewHeader : editorHeader).appendChild(previewSwitchWrap);
                if (previewOn) {
                    updatePreview();
                } else {
                    previewBody.innerHTML = '<div class="preview-off">' + L10N.previewOffHint + '</div>';
                }
            }

            function syncPreviewToggle() {
                previewOn = previewSwitch.checked;
                try { localStorage.setItem(PREVIEW_KEY, previewOn ? '1' : '0'); } catch (e) {}
                if (window.matchMedia('(max-width: 768px)').matches) {
                    editorShell.classList.toggle('show-preview', previewOn);
                }
                applyPreviewState();
            }

            function togglePreview() {
                previewSwitch.checked = !previewSwitch.checked;
                syncPreviewToggle();
            }

            previewSwitch.addEventListener('change', syncPreviewToggle);

            previewBody.addEventListener('click', function() {
                if (!previewOn) {
                    previewOn = true;
                    try { localStorage.setItem(PREVIEW_KEY, '1'); } catch (e) {}
                    applyPreviewState();
                }
            });

            // Debounced preview on input
            let previewDebounce = null;
            textarea.addEventListener('input', function() {
                clearTimeout(previewDebounce);
                previewDebounce = setTimeout(updatePreview, 150);
            });

            // Initial render once all libraries are loaded (defer attributes)
            function whenReady(cb) {
                if (window.marked && window.DOMPurify) return cb();
                setTimeout(function() { whenReady(cb); }, 50);
            }
            whenReady(applyPreviewState);

            function autoResize() {
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';
            }
            setTimeout(autoResize, 100);
            textarea.addEventListener('input', autoResize);
        })();
    </script>
</body>
</html>
