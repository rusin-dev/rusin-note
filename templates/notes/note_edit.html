<!DOCTYPE html>
<html{% if theme %} data-theme="{{ theme }}"{% endif %} lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ full_title|e }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preload" href="https://cdn.jsdmirror.cn/npm/@fortawesome/fontawesome-free@6.5.2/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://cdn.jsdmirror.cn/npm/@fortawesome/fontawesome-free@6.5.2/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"></noscript>
    {{ theme_script|safe }}
    <style>
        {{ theme_vars|safe }}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
        .navbar { background: var(--navbar-bg); padding: 8px 24px; border-bottom: 1px solid var(--navbar-border); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; font-size: 14px; position: fixed; top: 0; left: 0; right: 0; z-index: 30; }
        .navbar-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-size: 16px; font-weight: 600; min-width: 0; overflow: hidden; }
        .navbar-brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .navbar-brand:hover { color: var(--link); }
        .navbar-brand-icon { width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0; }
        .navbar .user-info { font-weight: 500; text-align: center; white-space: nowrap; }
        .navbar .nav-links { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; min-width: 0; }
        .navbar .nav-links a { margin-left: 16px; color: var(--link); text-decoration: none; }
        .navbar .nav-links a:hover { text-decoration: underline; }
        .navbar .nav-links i { margin-right: 5px; }
        .theme-toggle { width: auto; margin-left: 16px; padding: 4px 14px; font-size: 13px; border-radius: 14px; background: var(--btn-bg); border: 1px solid var(--navbar-border); color: var(--text); cursor: pointer; }
        form { height: 100vh; display: flex; flex-direction: column; padding-top: 50px; }
        textarea { flex: 1; width: 100%; border: none; padding: 20px 24px; font-size: 16px; line-height: 1.7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; resize: none; outline: none; background: var(--bg); color: var(--text); }
        .save-btn { position: fixed; bottom: 24px; right: 24px; background: var(--btn-bg); border: 1px solid var(--navbar-border); padding: 8px 20px; border-radius: 20px; font-size: 14px; color: var(--text); cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; z-index: 10; font-weight: 500; }
        .save-btn:hover { background: var(--btn-hover); transform: scale(1.02); }
        .save-btn:active { background: var(--border); transform: scale(0.98); }
        .save-hint { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.75); color: #fff; padding: 10px 24px; border-radius: 24px; font-size: 14px; letter-spacing: 0.5px; backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; z-index: 20; font-weight: 400; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .save-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .save-hint kbd { background: rgba(255, 255, 255, 0.2); padding: 2px 12px; border-radius: 6px; margin: 0 4px; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.15); font-family: inherit; }
        .save-status { position: fixed; bottom: 80px; right: 24px; font-size: 14px; color: #4CAF50; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; z-index: 15; background: var(--status-bg); padding: 6px 18px; border-radius: 16px; border: 1px solid #4CAF50; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transform: translateY(10px); }
        .save-status.show { opacity: 1; transform: translateY(0); }
        .save-status.saving { color: #ff9800; border-color: #ff9800; }
        .save-status.error { color: #f44336; border-color: #f44336; }
        .note-mtime { position: fixed; bottom: 24px; left: 24px; font-size: 12px; color: var(--muted); z-index: 10; user-select: none; }
        @media (max-width: 640px) {
            .navbar { grid-template-columns: 1fr 1fr; grid-template-areas: "brand links" "user user"; row-gap: 6px; column-gap: 12px; padding: 8px 16px; }
            .navbar-brand { grid-area: brand; }
            .navbar .user-info { grid-area: user; text-align: center; }
            .navbar .nav-links { grid-area: links; justify-content: flex-end; }
            form { padding-top: 88px; }
            textarea { padding: 16px 18px; font-size: 15px; }
            .save-btn { bottom: 16px; right: 16px; padding: 6px 16px; font-size: 13px; }
            .save-hint { bottom: 70px; padding: 8px 16px; font-size: 12px; white-space: nowrap; }
            .save-status { bottom: 70px; right: 16px; font-size: 12px; padding: 4px 14px; }
            .note-mtime { bottom: 16px; left: 16px; font-size: 11px; }
        }
    </style>
</head>
<body>
    {% include "partials/_navbar.html" %}
    <form method="POST" action="{{ action_url }}" id="noteForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <textarea name="content" id="noteContent" autofocus spellcheck="true">{{ content|e }}</textarea>
        <button type="button" class="save-btn" id="saveBtn">{{ t('note_save_btn') }}</button>
    </form>
    <div class="save-hint" id="saveHint">{{ hint_text|safe }}</div>
    <div class="save-status" id="saveStatus"></div>
    <div class="note-mtime" id="noteMtime">{{ last_edited }}</div>
    <script>
        (function() {
            const form = document.getElementById('noteForm');
            const textarea = document.getElementById('noteContent');
            const saveBtn = document.getElementById('saveBtn');
            const saveHint = document.getElementById('saveHint');
            const saveStatus = document.getElementById('saveStatus');
            let saveTimeout = null;
            let statusTimeout = null;
            let hintTimeout = null;
            let isSaving = false;
            const DEFAULT_HINT = {{ hint_text|tojson }};
            const L10N = {{ l10n|tojson }};
            const CSRF_FIELD = "csrf_token";

            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 4;
                }
            });

            function showHint(message) {
                if (message) saveHint.innerHTML = message;
                saveHint.classList.add('show');
                clearTimeout(hintTimeout);
                hintTimeout = setTimeout(function() { saveHint.classList.remove('show'); }, 4000);
            }

            function showStatus(message, type) {
                saveStatus.textContent = message;
                saveStatus.className = 'save-status show';
                if (type) saveStatus.classList.add(type);
                clearTimeout(statusTimeout);
                statusTimeout = setTimeout(function() { saveStatus.classList.remove('show'); }, 2500);
            }

            setTimeout(function() { showHint(DEFAULT_HINT); }, 600);

            let inputTimer = null;
            textarea.addEventListener('input', function() {
                clearTimeout(inputTimer);
                inputTimer = setTimeout(function() { showHint(DEFAULT_HINT); }, 3000);
            });
            textarea.addEventListener('focus', function() { showHint(DEFAULT_HINT); });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveNote();
                }
                if (e.key === 'Escape') {
                    saveHint.classList.remove('show');
                    saveStatus.classList.remove('show');
                }
            });

            saveBtn.addEventListener('click', function(e) {
                e.preventDefault();
                saveNote();
            });

            function saveNote() {
                if (isSaving) return;
                isSaving = true;
                showStatus(L10N.saving, 'saving');
                const content = textarea.value;
                const csrfValue = form.querySelector('input[name="' + CSRF_FIELD + '"]').value;
                fetch(window.location.href, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'content=' + encodeURIComponent(content) + '&' + CSRF_FIELD + '=' + encodeURIComponent(csrfValue)
                })
                .then(response => {
                    isSaving = false;
                    if (response.ok) {
                        showStatus(L10N.saved, '');
                        showHint(L10N.savedHint);
                    } else {
                        showStatus(L10N.failedStatus.replace('{status}', response.status), 'error');
                        showHint(L10N.retryHint);
                    }
                })
                .catch(error => {
                    isSaving = false;
                    showStatus(L10N.netError, 'error');
                    showHint(L10N.failedMsg + error.message);
                });
            }

            function autoResize() {
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';
            }
            setTimeout(autoResize, 100);
            textarea.addEventListener('input', autoResize);
        })();
    </script>
</body>
</html>
