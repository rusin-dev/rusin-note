<!DOCTYPE html>
<html{% if theme %} data-theme="{{ theme }}"{% endif %} lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if full_title or title %}{{ full_title|default(title)|e }} | {% endif %}{{ site_name|e }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preload" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="{{ config.GLOBAL_CDN }}/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"></noscript>
    {{ theme_script|safe }}
    {{ pygments_head|safe }}
    <style>
        {{ theme_vars|safe }}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
        .navbar {
            background: var(--navbar-bg);
            padding: 10px 24px;
            border-bottom: 1px solid var(--navbar-border);
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 16px;
            font-size: 14px;
            overflow: hidden;
        }
        .navbar-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-size: 16px; font-weight: 600; flex-shrink: 0; min-width: 0; overflow: hidden; }
        .navbar-brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .navbar-brand:hover { color: var(--link); }
        .navbar-brand-icon { width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0; }
        .navbar .user-info { font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.navbar .nav-links { display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0; white-space: nowrap; gap: 2px; }
        .navbar .nav-links a {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            color: var(--link);
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }
        .navbar .nav-links a:hover { background: var(--card-bg); color: var(--text); text-decoration: none; }
        .navbar .nav-links a:active { transform: scale(0.96); }
        .navbar .nav-links i { font-size: 13px; }
        .avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: middle; flex-shrink: 0; }
        .navbar .user-info .avatar { margin-right: 6px; }
        .theme-toggle, .nav-menu-btn {
            width: 36px; height: 36px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; font-size: 15px;
            border-radius: 8px;
            background: var(--bg);
            border: 1px solid var(--navbar-border);
            color: var(--text);
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .theme-toggle:hover, .nav-menu-btn:hover { background: var(--card-bg); }
        .lang-toggle {
            display: inline-flex; align-items: center; gap: 6px;
            height: 36px; padding: 0 10px;
            border-radius: 8px;
            background: var(--bg);
            border: 1px solid var(--navbar-border);
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 15px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .lang-toggle:hover { background: var(--card-bg); }
        .lang-toggle .fa-globe { font-size: 15px; }
        .nav-menu-btn { display: none; }
        .navbar.menu-collapsed { flex-wrap: wrap; }
        .navbar.menu-collapsed .nav-menu-btn { display: inline-flex; }
        .navbar.menu-collapsed .nav-links {
            order: 10;
            flex-basis: 100%;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            white-space: normal;
            display: none;
        }
        .navbar.menu-collapsed .nav-links a { margin-left: 0; padding: 10px 0; border-bottom: 1px solid var(--navbar-border); }
        .navbar.menu-collapsed .nav-links a:last-child { border-bottom: none; }
        .navbar.menu-collapsed.menu-open .nav-links {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--navbar-border);
            border-radius: 8px;
            padding: 6px 16px;
            margin-top: 2px;
        }
        @media (max-width: 640px) {
            .navbar { gap: 12px; padding: 10px 16px; }
            .navbar-brand-name { max-width: 45vw; }
        }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        h1 { font-weight: 400; border-bottom: 1px solid var(--heading-border); padding-bottom: 10px; }
        h2 { font-weight: 400; border-bottom: 1px solid var(--heading-border); padding-bottom: 8px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: 500; }
        input, button, textarea, select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text);
        }
        button { background: var(--btn-bg); cursor: pointer; }
        button:hover { background: var(--btn-hover); }
        .error { color: var(--error); }
        .note-list { list-style: none; padding: 0; }
        .note-list li { padding: 8px 0; border-bottom: 1px solid var(--list-border); }
        .note-list a { color: var(--link); text-decoration: none; }
        .note-list a:hover { text-decoration: underline; }
        .note-list .note-time { color: var(--muted); font-size: 13px; margin-left: 12px; }
        .note-list .note-size { color: var(--muted); font-size: 13px; margin-left: 12px; }
        .empty { color: var(--muted); }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .stat-card { border: 1px solid var(--card-border); border-radius: 8px; padding: 16px 20px; background: var(--card-bg); }
        .stat-card h3 { margin-bottom: 8px; font-weight: 400; color: var(--card-head); }
        .stat-card .number { font-size: 28px; font-weight: 500; }
        .stat-card .detail { color: var(--card-detail); font-size: 14px; margin-top: 4px; }
        .disclaimer { background: var(--disclaimer-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--disclaimer-border); }
        .markdown-body { font-size: 16px; line-height: 1.6; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { border-bottom: 1px solid var(--heading-border); padding-bottom: 6px; }
        .markdown-body ul, .markdown-body ol { padding-left: 2em; }
        .markdown-body code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-family: Consolas, Monaco, "Courier New", monospace; font-size: 0.9em; }
        .markdown-body pre { background: var(--code-bg); padding: 12px; border-radius: 4px; overflow-x: auto; }
        .markdown-body blockquote { border-left: 4px solid var(--quote-border); padding-left: 16px; color: var(--quote-text); }
        .markdown-body a { color: var(--link); }
        .home-hero { text-align: center; padding: 28px 8px 8px; }
        .home-hero h1 {
            border: none;
            font-size: 34px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--hero-grad-a), var(--hero-grad-b));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            padding-bottom: 0;
        }
        .home-hero p { color: var(--muted); margin-top: 10px; font-size: 15px; }
        .home-logo { width: 420px; height: 320px; background: #b1aaaa; border-radius: 12px; padding: 12px; margin-top: 8px; }
        .home-grid { list-style: none; padding: 0; margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .home-card {
            display: flex; align-items: center; gap: 14px; padding: 18px 20px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; text-decoration: none; color: var(--text);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }
        .home-card:hover { transform: translateY(-3px); border-color: var(--hover); box-shadow: var(--card-shadow); }
        .home-card:active { transform: translateY(-1px) scale(0.99); }
        .home-card:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
        .home-card-icon { flex-shrink: 0; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #546271; background: var(--card-icon-bg); border-radius: 10px; transition: transform 0.18s ease, background 0.18s ease; }
        .home-card:hover .home-card-icon { transform: scale(1.1); }
        .home-card-body { flex: 1; min-width: 0; }
        .home-card-title { display: block; font-size: 16px; font-weight: 600; }
        .home-card-desc { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.4; }
        .home-card-arrow { flex-shrink: 0; color: var(--muted); font-size: 14px; transition: transform 0.18s ease, color 0.18s ease; }
        .home-card:hover .home-card-arrow { transform: translateX(4px); color: var(--hover); }
        {{ extra_css|safe }}
    </style>
{% block extra_head %}{{ extra_head|safe }}{% endblock %}
</head>
<body>
    {% include "partials/_navbar.html" %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
    (function () {
        var GAP = 16;
        function updateMenuState() {
            var navbar = document.querySelector('.navbar');
            var links = document.querySelector('.nav-links');
            var menuBtn = document.querySelector('.nav-menu-btn');
            var brand = document.querySelector('.navbar-brand');
            var user = document.querySelector('.user-info');
            var theme = document.querySelector('.theme-toggle');
            if (!navbar || !links || !menuBtn || !brand) return;
            var wasOpen = navbar.classList.contains('menu-open');
            navbar.classList.remove('menu-collapsed', 'menu-open');
            [links, user, theme].forEach(function (el) {
                if (!el) return;
                el.style.position = 'absolute';
                el.style.visibility = 'hidden';
                el.style.whiteSpace = 'nowrap';
            });
            if (user) user.style.flex = 'none';
            var linksW = links.scrollWidth;
            var userW = user ? user.scrollWidth : 0;
            var themeW = theme ? theme.offsetWidth : 0;
            var menuW = menuBtn.offsetWidth;
            var total = brand.offsetWidth + userW + linksW + themeW + menuW + GAP * 3;
            [links, user, theme].forEach(function (el) {
                if (!el) return;
                el.style.position = '';
                el.style.visibility = '';
                el.style.whiteSpace = '';
            });
            if (user) user.style.flex = '';
            if (total > navbar.clientWidth) {
                navbar.classList.add('menu-collapsed');
                if (wasOpen) navbar.classList.add('menu-open');
            }
        }
        window.toggleMenu = function () {
            var navbar = document.querySelector('.navbar');
            var menuBtn = document.querySelector('.nav-menu-btn');
            if (!navbar || !menuBtn) return;
            var open = navbar.classList.toggle('menu-open');
            menuBtn.innerHTML = open
                ? '<i class="fa-solid fa-xmark" aria-hidden="true"></i>'
                : '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
        };
        window.addEventListener('load', updateMenuState);
        window.addEventListener('resize', updateMenuState);
        updateMenuState();
    })();
    </script>
</body>
</html>
