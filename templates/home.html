{% extends "base.html" %}
{% block content %}
<div class="home-hero">
    <h1>{{ site_name|e }}</h1>
    <p>{{ t('home_tagline') }}</p>
</div>
<div class="home-grid">
    {% for href, icon, title, desc in cards %}
    <a class="home-card" href="{{ href|e }}">
        <span class="home-card-icon"><i class="fa-solid {{ icon|e }}" aria-hidden="true"></i></span>
        <span class="home-card-body">
            <span class="home-card-title">{{ title }}</span>
            <span class="home-card-desc">{{ desc }}</span>
        </span>
        <span class="home-card-arrow"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
    </a>
    {% endfor %}
    <a class="home-card" href="https://github.com/rusin-dev/rusin-note" target="_blank" rel="noopener noreferrer">
        <span class="home-card-icon"><i class="fa-brands fa-github" aria-hidden="true"></i></span>
        <span class="home-card-body">
            <span class="home-card-title">{{ t('home_github') }}</span>
            <span class="home-card-desc">{{ t('home_github_desc') }}</span>
        </span>
        <span class="home-card-arrow"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
    </a>
</div>
{% endblock %}
