name: Force reset main to dev

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN }}  # 需要有 push 权限

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 强制重置 main 到 dev
        run: |
          git fetch origin main dev
          git checkout main
          git reset --hard origin/dev    # main 指向 dev 的最新提交
          git push --force origin main   # 强制推送，覆盖远程 main