name: Auto-merge dev to main (no PR)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并 dev 到 main
        run: |
          # 切换到 main 分支
          git checkout main
          git fetch origin dev

          # 先尝试普通合并，允许失败
          set +e
          git merge origin/dev --no-ff -m "Auto-merge from dev"
          MERGE_EXIT=$?
          set -e

          # 如果合并失败（有冲突）
          if [ $MERGE_EXIT -ne 0 ]; then
            echo "合并有冲突，使用 ours 策略解决..."
            
            # 中止当前合并
            git merge --abort
            
            # 重新合并，使用 ours 策略
            git merge origin/dev --no-ff \
              --strategy-option=ours \
              -m "Auto-merge from dev (resolved with ours strategy)"
          fi

          # 推送合并结果
          git push origin main
