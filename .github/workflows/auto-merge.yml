name: Auto-merge dev to main (no PR)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 同步 dev 到 main（保留 .github）
        run: |
          # 获取最新代码
          git fetch origin main dev

          # 切换到 main 并重置为远程最新
          git checkout main
          git reset --hard origin/main

          # 用 dev 的所有文件覆盖工作区（相当于应用 dev 的全部变更）
          git checkout origin/dev -- .

          # 添加所有变更
          git add -A

          # 如果有变更则提交并推送，否则跳过
          if git diff --quiet --cached; then
            echo "main 已与 dev 同步（.github 除外），无需提交"
          else
            git commit -m "Sync main with dev (keep .github)"
            git push origin main
          fi
