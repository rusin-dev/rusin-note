name: Auto-merge dev to main (no PR)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并 dev 到 main（保留 .github）
        run: |
          git checkout main
          git fetch origin dev

          # 备份 .github
          if [ -d .github ]; then
            mkdir -p /tmp/backup
            cp -r .github /tmp/backup/
          fi

          # 硬重置到 dev（main 完全变成 dev 的内容）
          git reset --hard origin/dev

          # 恢复 .github
          if [ -d /tmp/backup/.github ]; then
            rm -rf .github
            cp -r /tmp/backup/.github .github
            git add .github
            git commit -m "Restore .github from main after syncing with dev"
          fi

          # 强制推送
          git push origin main --force
