name: Auto-merge dev to main (no PR)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并 dev 到 main
        run: |
          git checkout main
          git fetch origin dev

          # 创建临时分支保存 main 状态
          git checkout -b temp-merge
          
          # 合并 dev
          set +e
          git merge origin/dev --no-ff -m "Auto-merge from dev"
          if [ $? -ne 0 ]; then
            echo "检测到冲突，手动解决..."
            
            # 对于所有冲突文件，使用 main 的版本
            git status --porcelain | grep "^UU" | while read status file; do
              echo "保留 main 版本: $file"
              git checkout --ours -- "$file"
              git add "$file"
            done
            
            # 如果有删除冲突（dev删除了但main保留）
            git status --porcelain | grep "^DU" | while read status file; do
              echo "恢复被删除的文件: $file"
              git checkout HEAD -- "$file"
              git add "$file"
            done
            
            git commit -m "Auto-merge from dev (resolved conflicts)"
          fi
          set -e

          # 切回 main 并合并临时分支
          git checkout main
          git merge temp-merge --no-ff -m "Merge dev to main"
          
          # 删除临时分支
          git branch -d temp-merge

          # 推送
          git push origin main
