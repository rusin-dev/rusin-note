name: Auto-merge dev to main (no PR)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合并 dev 到 main
        run: |
          # 切换到 main 分支
          git checkout main
          git fetch origin dev

          # 使用 ours 策略合并，遇到冲突时保留 main 的版本
          # 这样即使 dev 删除了 .github 文件夹，main 也会保留
          git merge origin/dev --no-ff \
            --strategy-option=ours \
            -m "Auto-merge from dev (keep main's files when conflict)"

          # 推送合并结果
          git push origin main
