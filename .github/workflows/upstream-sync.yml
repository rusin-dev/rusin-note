name: Sync from Upstream

on:
  repository_dispatch:
    types: [sync-upstream]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/rusin-dev/rusin-note.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream changes
        run: git merge upstream/main --allow-unrelated-histories -m "Merge upstream updates"

      - name: Push changes (using PAT)
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ruying-suixing/rusin-note.git
          git push origin main