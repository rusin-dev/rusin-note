name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  # 检测本次变更中是否包含 Python 代码（.py 文件）
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检测变更的文件后缀
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - '**/*.py'
            frontend:
              - '**/*.html'
              - '**/*.css'
              - '**/*.js'
              - '**/*.json'
              - 'tests/frontend_check.py'
              - '.github/workflows/check.yml'

  # 前端语法检查：Jinja2 模板 + 内联 JS/CSS + JSON（不依赖后端服务）
  frontend:
    runs-on: ubuntu-latest
    needs: changes
    # 没有修改前端相关文件时跳过前端语法检查
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Jinja2
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: 前端语法检查
        run: python tests/frontend_check.py

  test:
    runs-on: ubuntu-latest
    needs: changes
    # 没有修改 Python 代码时，跳过服务 ping 测试
    if: ${{ needs.changes.outputs.python == 'true' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行 pytest 测试套件
        run: python -m pytest tests/ -q

      - name: 后台启动服务并健康检查
        run: |
          # 1. 后台启动服务（使用 -m app 方式，监听 8080 端口）
          python3 -m app > server.log 2>&1 &

          # 2. 等待服务就绪（最多 30 秒，每 2 秒尝试一次）
          echo "等待服务启动..."
          for i in {1..15}; do
            if curl -s -f http://localhost:8080 > /dev/null; then
              echo "服务已就绪"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "服务启动超时，日志内容："
              cat server.log
              exit 1
            fi
            sleep 2
          done

          # 3. 正式发送健康检查，失败则退出
          echo "发送健康检查请求..."
          curl -v -f http://localhost:8080
