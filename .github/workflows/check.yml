name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖（本项目无额外依赖，如有请在此添加）
        run: |
          python -m pip install --upgrade pip
          # 如果你的项目有 requirements.txt，请取消下一行注释
          # pip install -r requirements.txt

      - name: 后台启动服务（监听 3000 端口）并健康检查
        run: |
          # 1. 后台启动服务（注意：代码默认端口 8080，我们通过 -c 临时覆盖为 3000）
          python3 -c "import main; main.run_server(3000)" > server.log 2>&1 &

          # 2. 等待服务就绪（最多 30 秒，每 2 秒尝试一次）
          echo "等待服务启动..."
          for i in {1..15}; do
            if curl -s -f http://localhost:3000 > /dev/null; then
              echo "服务已就绪"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "服务启动超时，日志内容："
              cat server.log
              exit 1
            fi
            sleep 2
          done

          # 3. 正式发送健康检查，失败则退出（非零退出码）
          echo "发送健康检查请求..."
          curl -v -f http://localhost:3000
