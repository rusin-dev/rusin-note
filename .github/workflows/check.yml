name: CI

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 后台启动服务并健康检查
        run: |
          # 1. 后台启动服务（使用 -m app 方式，监听 8080 端口）
          python3 -m app > server.log 2>&1 &

          # 2. 等待服务就绪（最多 30 秒，每 2 秒尝试一次）
          echo "等待服务启动..."
          for i in {1..15}; do
            if curl -s -f http://localhost:8080 > /dev/null; then
              echo "服务已就绪"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "服务启动超时，日志内容："
              cat server.log
              exit 1
            fi
            sleep 2
          done

          # 3. 正式发送健康检查，失败则退出
          echo "发送健康检查请求..."
          curl -v -f http://localhost:8080