name: Desktop Build

on:
  push:
    branches: [ "dev" ]
    tags: [ "desktop-v*" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空取 desktop/pyproject.toml）"
        required: false
        default: ""
      channel:
        description: "更新渠道"
        required: true
        default: "stable"
        type: choice
        options: [ stable, beta ]
      notes:
        description: "更新说明（展示在 /downloads 落地页）"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  # 只有改动桌面端时才跑单元测试（标签/手动构建在 build 内各平台自测）
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - '.github/workflows/desktop-build.yml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 编译 pycairo / pygobject 需要系统头文件与 pkg-config
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-webkit2-4.1 libgtk-3-dev \
            libcairo2-dev pkg-config gcc python3-dev
        working-directory: .

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行桌面端测试
        run: uv run pytest tests/ -q -m "not network"

  build:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux 的 pywebview 走 GTK/WebKit2，PyGObject 需要系统头文件与 GIR
      - name: 安装 Linux 系统依赖
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-webkit2-4.1 libgtk-3-dev \
            libcairo2-dev pkg-config gcc python3-dev
        working-directory: .

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行桌面端测试
        run: uv run pytest tests/ -q -m "not network"

      - name: 解析版本与渠道
        id: meta
        shell: bash
        run: |
          version="${{ inputs.version }}"
          channel="${{ inputs.channel }}"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            # 带预发布后缀（如 1.0.0-rc.1）的标签归入 beta 渠道
            if [[ "$version" == *-* ]]; then channel="beta"; else channel="stable"; fi
          fi
          if [[ -z "$channel" ]]; then channel="stable"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: 构建并生成下载产物
        shell: bash
        run: |
          args=(--channel "${{ steps.meta.outputs.channel }}" --notes "${{ inputs.notes }}")
          if [[ -n "${{ steps.meta.outputs.version }}" ]]; then
            args+=(--version "${{ steps.meta.outputs.version }}")
          fi
          uv run python release/build.py "${args[@]}"

      - name: 上传本平台产物
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.platform }}
          path: desktop/dist/downloads/
          if-no-files-found: error
          retention-days: 7

  # 合并三平台清单为 manifest.json，产出可直接投放到 <DATA_DIR>/downloads/ 的目录
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # merge 里也要 uv sync，同样需要系统依赖
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-webkit2-4.1 libgtk-3-dev \
            libcairo2-dev pkg-config gcc python3-dev
        working-directory: .

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 下载各平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          path: desktop/dist/downloads/
          merge-multiple: true

      - name: 合并清单
        run: |
          uv run python release/build.py --merge dist/downloads
          find dist/downloads -name 'manifest-*.json' -delete

      - name: 上传站点下载目录
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: desktop/dist/downloads/
          if-no-files-found: error
          retention-days: 30
