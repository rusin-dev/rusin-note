name: Labeler

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label based on title
        uses: actions/github-script@v7
        with:
          # 如果需要临时使用 Node 20，可以取消下面一行的注释
          # env:
          #   ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          script: |
            // 直接使用全局的 context、github、core
            const payload = context.payload;
            let title = '';
            let issue_number = null;
            const repo = context.repo;

            // 获取标题和编号（兼容 Issue 和 PR）
            if (payload.issue) {
              title = payload.issue.title;
              issue_number = payload.issue.number;
            } else if (payload.pull_request) {
              title = payload.pull_request.title;
              issue_number = payload.pull_request.number;
            } else {
              console.log('No issue or PR found');
              return;
            }

            // ===== 在这里自定义您的标签规则 =====
            const rules = [
              { regex: /bug|fix|错误|故障/i, label: 'bug' },
              { regex: /feature|enhancement|新功能|改进/i, label: 'enhancement' },
              { regex: /doc|documentation|文档/i, label: 'documentation' },
              { regex: /question|疑问|help|求助/i, label: 'question' },
              { regex: /duplicate|重复/i, label: 'duplicate' },
              { regex: /wontfix|不修复/i, label: 'wontfix' },
              // 可继续添加更多规则，如：
              // { regex: /urgent|紧急/i, label: 'priority' },
            ];
            // ==================================

            // 收集所有匹配的标签
            const labelsToAdd = [];
            for (const rule of rules) {
              if (rule.regex.test(title)) {
                labelsToAdd.push(rule.label);
              }
            }

            if (labelsToAdd.length === 0) {
              console.log('No matching labels');
              return;
            }

            // 获取当前已有的标签，避免重复添加
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issue_number
            });
            const existingLabelNames = currentLabels.map(l => l.name);
            const newLabels = labelsToAdd.filter(l => !existingLabelNames.includes(l));

            if (newLabels.length === 0) {
              console.log('Labels already present');
              return;
            }

            // 添加新标签
            await github.rest.issues.addLabels({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issue_number,
              labels: newLabels
            });
