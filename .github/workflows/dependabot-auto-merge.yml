name: Dependabot auto-merge

# 注意：使用 pull_request_target 而非 pull_request，才能在 Dependabot 的 PR 上
# 读取自定义 secret（AUTO_MERGE_TOKEN）。该事件在默认分支上下文运行，
# 本工作流不 checkout PR 代码，仅读取元数据 + 调用 gh CLI，安全。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # 仅处理 Dependabot 打开的 PR
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: 读取 Dependabot 元数据（依赖级别、更新类型）
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # patch / minor 更新：用高权限 token 强制合并
      # --admin 会绕过 required status checks（FOSSA 三项）与 required approvals
      - name: 强制合并（patch / minor）
        if: >-
          ${{
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          }}
        run: gh pr merge "$PR_URL" --admin --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}

      # major 更新破坏性较强：只审批，保留人工 review（不自动合并）
      - name: 审批 PR（major）
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        run: gh pr review "$PR_URL" --approve
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
